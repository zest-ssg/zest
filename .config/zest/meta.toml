# ─── Zest CLI Branding ────────────────────────────────
# CLI name, version, and the tagline shown in `zest --help`.
# Embedded as the manifest resource `zest.meta.toml` and read by
# Zest.App.CommandLine.HelpRenderer. During local development the
# renderer falls back to this file on disk.
#
# Keep in sync with <Version> in Directory.Build.props — the help banner
# prints whichever version this file declares.

[meta]
version    = "0.8.0"
header     = "Zest v{0} — Easy Static-site Toolkit"
ecosystem  = "Ecosystem: .zlk + .zest.fsx + .zcss"
