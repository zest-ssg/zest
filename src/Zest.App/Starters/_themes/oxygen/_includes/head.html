<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="canonical" href="{{ site.base_url | default('') }}{{ page.url }}">
<link rel="alternate" type="application/rss+xml" href="/rss.xml" title="{{ site.title }} Feed">
<link rel="alternate" type="application/atom+xml" href="/atom.xml" title="{{ site.title }} Atom Feed">
<link rel="stylesheet" href="/assets/css/main.css">
<title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description | default('') }}{% endif %}">
