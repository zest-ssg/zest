{# footer.html — social links and attribution, following the Duo look. #}
{# RSS lives in site.socials (see _init.zest.fsx), so no duplicate hardcoded link. #}
<footer class="footer">
  <div class="footer__content">
    <ul class="footer__links">
      {% for s in site.socials %}
      <li><a href="{{ s.url }}" rel="me">{{ s.label }}</a></li>
      {% endfor %}
    </ul>
    <p class="footer__attribution">{{ 'footer.built_with' | t }} · {{ site.title }}</p>
  </div>
</footer>
