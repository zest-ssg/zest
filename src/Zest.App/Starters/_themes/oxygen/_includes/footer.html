<footer class="site-footer">
  <div class="container site-footer__inner">
    <p class="site-footer__copy">{{ 'footer.built_with' | t }}</p>
    <ul class="site-footer__socials">
      {% for s in site.socials %}
      <li><a href="{{ s.url }}" rel="me">{{ s.label }}</a></li>
      {% endfor %}
    </ul>
  </div>
</footer>
