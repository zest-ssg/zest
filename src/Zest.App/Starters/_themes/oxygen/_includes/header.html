<header class="site-header">
    <div class="site-header__inner">
        <a class="site-header__brand" href="/">{{ site.title }}</a>
        <nav class="site-nav" aria-label="{{ 'a11y.primary_nav' | t }}">
            {% if nav and nav.items %}
            {% for item in nav.items %}
            <a class="site-nav__link" href="{{ item.url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.label }}</a>
            {% endfor %}
            {% else %}
            <a class="site-nav__link" href="/" {% if page.url == "/" %}aria-current="page"{% endif %}>{{ 'nav.home' | t }}</a>
            <a class="site-nav__link" href="/posts/" {% if page.url startsWith "/posts/" %}aria-current="page"{% endif %}>{{ 'nav.blog' | t }}</a>
            <a class="site-nav__link" href="/features/" {% if page.url startsWith "/features/" %}aria-current="page"{% endif %}>{{ 'nav.features' | t }}</a>
            <a class="site-nav__link" href="/about/" {% if page.url startsWith "/about/" %}aria-current="page"{% endif %}>{{ 'nav.about' | t }}</a>
            {% endif %}
        </nav>
    </div>
</header>
