# oxygen — a calm, editorial starter theme for Zest.
#
# Warm paper background, ink text, a single jade accent, serif headings,
# hairline rules. Deliberately quiet: no animation, no shadows, no hover
# lifts, no smooth scrolling — just typography and whitespace.

name = "oxygen"
version = "2.1.0"
description = "A quiet, editorial theme: warm paper, ink text, jade accent, serif headings, hairline rules."

[theme]
author = "Zest"
license = "MIT"
tags = ["minimal", "editorial", "light", "dark"]

[data]
reading_time_label = "min read"
default_og_image = "/assets/img/og-default.png"

