<!DOCTYPE html>
<html lang="{{ site.language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <meta name="theme-color" content="#3c6a5a">
  <meta property="og:type" content="article">
  <meta property="og:title" content="{{ page.title }}">
  <meta property="og:description" content="{{ page.description }}">
  <meta name="twitter:card" content="summary">
  <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body>
  {{ include header.html }}
  <main class="site-main" id="main">
    <article class="post">
      <header class="post__header">
        <h1 class="post__title">{{ page.title }}</h1>
        <p class="post__meta">
          {% if page.date %}<time datetime="{{ page.date | date('yyyy-MM-dd') }}">{{ page.date | date('MMMM d, yyyy') }}</time>{% endif %}
          {% if page.tags %}<span class="post__tags">{% for tag in page.tags %}<a class="tag" href="/tags/{{ tag }}/">{{ tag }}</a>{% endfor %}</span>{% endif %}
          <span class="post__reading">{{ content | readingTime }} {{ 'meta.min_read' | t }}</span>
        </p>
      </header>
      <div class="post__body">
        {{ content | safe }}
      </div>
    </article>
  </main>
  {{ include footer.html }}
</body>
</html>
