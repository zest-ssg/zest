<!DOCTYPE html>
<html lang="{{ site.language }}">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0074d9" />
    <title>{% if page.url != "/" %}{{ page.title }} — {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default(site.description) }}" />
    <link rel="stylesheet" href="/assets/css/main.css" />
    <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="/rss.xml" />
    <link rel="canonical" href="{{ site.base_url }}{{ page.url }}" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="{{ site.title }}" />
    <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}" />
    <meta property="og:description" content="{{ page.description | default(site.description) }}" />
    <meta property="og:url" content="{{ site.base_url }}{{ page.url }}" />
    {% if page.image %}<meta property="og:image" content="{{ page.image }}" />{% endif %}
    <meta name="twitter:card" content="{% if page.image %}summary_large_image{% else %}summary{% endif %}" />
    {% if page.image %}<meta name="twitter:image" content="{{ page.image }}" />{% endif %}
    {{ pjaxScript | safe }}
</head>
<body>
    <a href="#main-content" class="skip-link">{{ 'a11y.skip_to_content' | t }}</a>
    <div class="layout-wrapper">
        {{ include header.html }}
        <main class="site-main" id="main-content">
            <div class="container">
                {{ content | safe }}
            </div>
        </main>
        {{ include footer.html }}
    </div>
</body>
</html>
